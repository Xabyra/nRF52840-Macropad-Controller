# --- СТАБІЛЬНІСТЬ ТА ПАМ'ЯТЬ ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT=y     
CONFIG_LOG=n
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y
CONFIG_BT_DEVICE_NAME="My Macropad"
CONFIG_BT_DEVICE_APPEARANCE=961 

CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_GPIO=y

CONFIG_USE_DT_CODE_PARTITION=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y

# --- НОВІ НАЛАШТУВАННЯ ДЛЯ МАКРОПАДУ ТА МУЛЬТИПІДКЛЮЧЕННЯ ---
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_BONDABLE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Дозволяємо системі коректно спати між натисканнями
#CONFIG_PM_DEVICE=y

CONFIG_KSCAN=y

# Підтримка сенсорів (для QDEC енкодера)
CONFIG_SENSOR=y

# Якщо плануєш використовувати PWM для плавного згасання LED (опціонально)
CONFIG_PWM=y
CONFIG_LED=y

# Перенаправлення консолі на RTT
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Обов'язково для nRF52, щоб він не засинав занадто глибоко під час налагодження
CONFIG_SERIAL=n

CONFIG_NFCT_PINS_AS_GPIOS=y


CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_BT_BAS=y

# --- LOW POWER SLEEP SUPPORT ---
# nRF52840 uses standard Zephyr sleep APIs
# GPIO interrupts work with standard GPIO configuration
# No special PM config needed

CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# --- Розширення розміру пакету даних (DLE & MTU) ---
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247